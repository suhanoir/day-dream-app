<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Rich Deep Midnight Twilight Background Gradient -->
    <linearGradient id="dd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Subtle Ambient Violet-Cyan Glow Behind Moon -->
    <radialGradient id="dd-ambient" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)" />
      <stop offset="70%" stop-color="rgba(56, 189, 248, 0.08)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </radialGradient>

    <!-- Pure Lunar Silver Gradient -->
    <linearGradient id="dd-moon" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Golden Guiding Star Gradient (Dreams & Goals) -->
    <linearGradient id="dd-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Cloud Gradient with Calming Translucency -->
    <linearGradient id="dd-cloud" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="60%" stop-color="rgba(226, 232, 240, 0.85)" />
      <stop offset="100%" stop-color="rgba(148, 163, 184, 0.7)" />
    </linearGradient>

    <!-- Inner Border Highlight -->
    <linearGradient id="dd-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(147, 197, 253, 0.15)" />
    </linearGradient>

    <!-- Drop Shadow for Float Effect -->
    <filter id="dd-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="100" height="100" rx="22.5" fill="url(#dd-bg)" />
  
  <!-- Subtle Ambient Glow -->
  <rect width="100" height="100" rx="22.5" fill="url(#dd-ambient)" />

  <!-- Ultra-clean Inner Border Stroke -->
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.75" fill="none" stroke="url(#dd-border)" stroke-width="1.5" />

  <!-- Main Symbol Group with Floating Shadow -->
  <g filter="url(#dd-shadow)">
    <!-- Crescent Moon: Mathematically harmonic arc -->
    <path d="M 50 18 C 32.327 18 18 32.327 18 50 C 18 67.673 32.327 82 50 82 C 58.647 82 66.527 78.568 72.316 73.012 C 59.882 71.936 50 61.42 50 48.5 C 50 36.31 58.747 26.242 70.187 24.316 C 64.382 20.404 57.458 18 50 18 Z" fill="url(#dd-moon)" />

    <!-- Calming Horizon Dream Cloud cradling the lower base -->
    <path d="M 36 74 C 31.582 74 28 70.418 28 66 C 28 61.986 30.957 58.663 34.829 58.077 C 36.216 52.378 41.353 48 47.5 48 C 54.673 48 60.536 53.585 60.971 60.655 C 62.196 59.626 63.774 59 65.5 59 C 69.642 59 73 62.358 73 66.5 C 73 70.446 69.957 73.68 66.082 73.974 C 65.892 73.991 65.698 74 65.5 74 Z" fill="url(#dd-cloud)" />

    <!-- Radiant 4-Point Golden North Star (Aspiration / Goals) -->
    <path d="M 70 20 Q 70 33 83 33 Q 70 33 70 46 Q 70 33 57 33 Q 70 33 70 20 Z" fill="url(#dd-star)" />

    <!-- Secondary Celestial Sparkle (Magic / Daydream) -->
    <path d="M 79 53 Q 79 57.5 83.5 57.5 Q 79 57.5 79 62 Q 79 57.5 74.5 57.5 Q 79 57.5 79 53 Z" fill="#38bdf8" opacity="0.95" />
  </g>
</svg>